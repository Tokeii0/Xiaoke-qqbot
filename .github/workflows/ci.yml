name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: node --check xiaoke_bot/web/app.js

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Check packaged web assets
        run: |
          python - <<'PY'
          import glob
          import zipfile
          with zipfile.ZipFile(glob.glob('dist/*.whl')[0]) as wheel:
              names = set(wheel.namelist())
              for asset in ('index.html', 'app.js', 'styles.css'):
                  assert f'xiaoke_bot/web/{asset}' in names, asset
          PY
